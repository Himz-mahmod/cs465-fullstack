<div class="container mt-4">
  <h1 class="mb-2">Travlr Getaways Admin</h1>
  <p class="text-muted mb-4">{{ message() }}</p>
  @if (auth.isLoggedIn()) {
    <a routerLink="/add-trip" class="btn btn-info mb-4">Add Trip</a>
  }
  <div class="row">
    @for (trip of trips(); track trip._id) {
      <div class="col-md-4 mb-4">
        <app-trip-card [trip]="trip" (deleted)="onTripDeleted($event)"></app-trip-card>
      </div>
    }
  </div>
</div>
